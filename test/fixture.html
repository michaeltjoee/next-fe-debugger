<!doctype html>
<!-- Fake Next.js (Pages Router) page for manually testing the extension.
     Serve it over http (content scripts don't run on file:// by default):
       npx serve test   or   python3 -m http.server -d test 8080 -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Next Data fixture</title>
    <!-- Versioned asset URLs for the Version tab. An unknown rel means nothing is fetched. -->
    <link rel="x-fixture-asset" href="https://assets-bucket.tiket.com/homepage-v4/v4.5.0/_next/static/chunks/main-3f9a.js" />
    <link rel="x-fixture-asset" href="https://assets-bucket.tiket.com/homepage-v4/v4.5.0/_next/static/css/app-81c2.css" />
    <link rel="x-fixture-asset" href="https://assets-bucket.tiket.com/remote-header/v2.13.1/_next/static/chunks/header-77d0.js" />
    <link rel="x-fixture-asset" href="https://assets-bucket.tiket.com/shared-components/footer/v1.4.0/remoteEntry.js" />
  </head>
  <body>
    <div id="__next">Fixture page — open DevTools → __NEXT_DATA__ tab.</div>
    <button id="mutate">Mutate window.__NEXT_DATA__ (test Watch)</button>
    <button id="login">Toggle logged-in sessionData (test Watch)</button>
    <script id="__NEXT_DATA__" type="application/json">
      {
        "props": {
          "pageProps": {
            "hotel": { "id": 123, "name": "Hotel Example", "rating": 4.5, "tags": ["pool", "wifi"], "promo": null },
            "user-agent": "fixture",
            "isMobile": false,
            "middlewareData": {
              "currency": "IDR",
              "locale": "id",
              "sessionData": {
                "sessionId": "6ac488dcb9331c6797948663",
                "accountId": null,
                "username": "",
                "firstname": null,
                "lastname": null,
                "audience": "tiket.com",
                "isRefreshToken": null,
                "deviceId": null,
                "loginMedia": null,
                "language": null,
                "currency": null,
                "tixPoint": null,
                "loyaltyLevel": null,
                "accessToken": null,
                "refreshToken": null,
                "additionalData": {},
                "isLogin": false
              }
            }
          },
          "__N_SSP": true
        },
        "page": "/hotel/[slug]",
        "query": { "slug": "hotel-example" },
        "buildId": "dev-fixture",
        "isFallback": false,
        "gssp": true,
        "scriptLoader": []
      }
    </script>
    <script>
      window.__NEXT_DATA__ = JSON.parse(document.getElementById("__NEXT_DATA__").textContent);
      // Stand-in for the app's own global, shown in the __CORE_DATA__ tab.
      window.__CORE_DATA__ = {
        env: "fixture",
        lang: "id",
        currency: "IDR",
        featureFlags: { wishlist: true, tripView: false },
      };
      document.getElementById("mutate").onclick = () => {
        window.__NEXT_DATA__.props.pageProps.hotel.rating = +(Math.random() * 5).toFixed(1);
      };
      document.getElementById("login").onclick = () => {
        const s = window.__NEXT_DATA__.props.pageProps.middlewareData.sessionData;
        s.isLogin = !s.isLogin;
        Object.assign(s, s.isLogin
          ? { accountId: 12345678, username: "dev@example.com", firstname: "Dev", lastname: "Tester", loyaltyLevel: "LV2", accessToken: "eyJhbGciOiJIUzI1NiJ9.fixture.signature" }
          : { accountId: null, username: "", firstname: null, lastname: null, loyaltyLevel: null, accessToken: null });
      };
    </script>
  </body>
</html>
